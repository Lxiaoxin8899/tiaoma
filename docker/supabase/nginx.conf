worker_processes  1;

events {
  worker_connections  1024;
}

http {
  # 简化版 API 网关，统一对外暴露 Supabase 风格路径
  client_max_body_size 10m;

  server {
    listen 8000;
    server_name _;

    # CORS 预检请求统一处理
    set $cors_origin $http_origin;
    if ($cors_origin = '') {
      set $cors_origin '*';
    }

    # REST API（PostgREST）
    location /rest/v1/ {
      # 处理 CORS 预检请求
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, Prefer, Accept-Profile, Content-Profile, x-supabase-api-version" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }

      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;

      # 避免与上游重复的 CORS 响应头
      proxy_hide_header Access-Control-Allow-Origin;

      # CORS 响应头
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, Prefer, Accept-Profile, Content-Profile, x-supabase-api-version" always;
    }

    # Auth API（GoTrue）
    location /auth/v1/ {
      # 处理 CORS 预检请求
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }

      proxy_pass http://auth:8081/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;

      proxy_hide_header Access-Control-Allow-Origin;

      # CORS 响应头
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version" always;
    }

    # 健康检查
    location /health {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      return 200 "ok";
    }
  }
}
