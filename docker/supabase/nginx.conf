worker_processes  1;

events {
  worker_connections  1024;
}

http {
  # 说明：简化版 API 网关，统一对外暴露 Supabase 风格路径

  # 说明：请求体大小限制（支持大文件上传）
  client_max_body_size 10m;

  server {
    listen 8000;
    server_name _;

    # 说明：CORS 预检请求统一处理
    set $cors_origin $http_origin;
    if ($cors_origin = '') {
      set $cors_origin '*';
    }

    # REST API（PostgREST）
    location /rest/v1/ {
      # 说明：处理 CORS 预检请求
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, Prefer" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }

      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;

      # 说明：CORS 响应头
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, Prefer" always;
    }

    # Auth API（GoTrue）
    location /auth/v1/ {
      # 说明：处理 CORS 预检请求
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }

      proxy_pass http://auth:8081/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;

      # 说明：CORS 响应头
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info" always;
    }

    # 说明：健康检查
    location /health {
      return 200 "ok";
    }
  }
}
